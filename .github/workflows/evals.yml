name: Evals

# ADR 0025: the text agent against the synthetic golden set. Fails when the score drops more than 2 points or the
# $ per entry rises more than 20% against evals/baseline.json. The run stops above USD 0.50.
on:
  pull_request:
    paths:
      - apps/api/src/modules/text-log/**
      - apps/api/src/evals/**
      - packages/catalog/remote/**
      - packages/core/src/food/**
      - evals/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kawsay/api generate
      - name: Run the golden set and gate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: pnpm evals --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
