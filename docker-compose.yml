# Local development database. Credentials are for local development only.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kawsay
      POSTGRES_PASSWORD: kawsay
      POSTGRES_DB: kawsay
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kawsay']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
