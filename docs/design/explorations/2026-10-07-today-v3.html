<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kawsay · Hoy v3 (prototipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#F6F2E8;--surface:#FFFFFF;--ink:#1C1F1A;--muted:#5E6358;--line:#E4DFD3;
 --brand:#1F4D3A;--accent:#B84E18;
 --g50:#EEF6F0;--g100:#D5EBDB;--g200:#B4DBBF;--g300:#86C497;--g400:#5BA66E;--g700:#255E3B;
 --amber:#EBC867;--amberText:#9A6B00;--red:#E58B7A;--redText:#B3392F;--grey:#B9B6AE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit}
html,body{margin:0;background:#E9E4D8}
body{font:15px/22px Figtree,system-ui,sans-serif;color:var(--ink)}
.stage{min-height:100vh;display:flex;justify-content:center;padding:16px 0}
.phone{width:390px;max-width:100%;background:var(--bg);border-radius:28px;overflow:hidden;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.12);height:844px;display:flex;flex-direction:column}
@media (max-width:430px){.stage{padding:0}.phone{border-radius:0;height:100vh;box-shadow:none}}
.scroll{flex:1;overflow-y:auto;padding:0 16px 130px;scroll-behavior:smooth}
h1,h2,h3,.num{font-family:"Bricolage Grotesque",Figtree,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 8px}
header h1{margin:0;font-size:22px;line-height:28px}
header small{display:block;color:var(--muted);font-size:13px}
.iconbtn{width:44px;height:44px;border:none;border-radius:50%;background:var(--surface);display:grid;place-items:center;cursor:pointer}
.card{background:var(--surface);border-radius:14px;padding:16px;margin:12px 0;transition:box-shadow .3s}
.card.pending{box-shadow:0 0 0 2px var(--accent)}
.card h2{margin:0 0 10px;font-size:17px;line-height:22px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h2 .right{margin-left:auto;font:600 13px Figtree;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.lbl{display:flex;align-items:center;gap:8px;font:600 14px Figtree;margin-bottom:6px}
.ib{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
/* summary rings */
.sum{display:flex;gap:14px;align-items:center}
.rings{position:relative;width:150px;height:150px;flex:none}
.rings svg{width:150px;height:150px;transform:rotate(-90deg)}
.rings .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rings .num{font-size:30px;line-height:32px;font-weight:700}
.seg{transition:stroke .35s}
.arc{transition:stroke-dasharray .5s cubic-bezier(.2,.8,.2,1)}
.leg{flex:1;font-size:13px;line-height:18px}
.leg .it{display:flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer;border:none;background:none;font:inherit;color:inherit;width:100%;text-align:left}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.move{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.move b{font-family:"Bricolage Grotesque";font-size:18px}
/* ranges */
.rb{margin:14px 0 2px}
.rb .top{display:flex;align-items:baseline;gap:8px;font-size:14px}
.rb .top b{font-weight:700}
.rb .top .v{margin-left:auto;font:700 15px "Bricolage Grotesque"}
.rb .top .st{font:700 12px Figtree;min-width:92px;text-align:right}
.track{position:relative;height:10px;border-radius:999px;display:flex;margin-top:8px}
.track i{height:100%}
.track i:first-child{border-radius:999px 0 0 999px}.track i:last-child{border-radius:0 999px 999px 0}
.marker{position:absolute;top:-5px;width:4px;height:20px;border-radius:3px;background:var(--ink);transform:translateX(-2px);transition:left .5s cubic-bezier(.2,.8,.2,1),opacity .3s}
.edges{position:relative;height:16px;font:600 10px Figtree;color:var(--g700)}
.edges span{position:absolute;top:2px;transform:translateX(-50%)}
/* chips & buttons */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font:600 14px Figtree;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .18s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--g100);border-color:var(--g700);color:var(--g700)}
.chip.add{border-style:dashed;color:var(--accent);border-color:var(--accent)}
.chip small{font-weight:400;color:var(--muted)}
.btn{min-height:44px;border:none;border-radius:10px;padding:10px 16px;font:700 15px Figtree;cursor:pointer;background:var(--accent);color:#fff;transition:transform .18s}
.btn:active{transform:scale(.95)}.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.block{width:100%}
.link{border:none;background:none;color:var(--accent);font:700 13px Figtree;cursor:pointer;padding:8px 0;min-height:44px}
/* meals */
.meal{padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:none}
.meal .head{display:flex;align-items:center;gap:10px}
.meal .head b{flex:1}
.meal .kcal{font:700 13px Figtree;color:var(--muted)}
.plus{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);font:700 22px Figtree;cursor:pointer}
.items{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:999px;padding:3px 10px 3px 3px;font:600 13px Figtree;border:none;cursor:pointer}
.fchip .fi{width:30px;height:30px}
/* food tiles */
.ftiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ftile{border:none;background:var(--surface);border-radius:14px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 12px/15px Figtree;color:var(--ink);transition:transform .18s;min-height:104px}
.ftile:active{transform:scale(.93)}
.ftile small{color:var(--muted);font-weight:400}
.fi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.tabs{display:flex;gap:6px;margin-bottom:10px}
/* activity */
.noact{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;background:none;width:100%;text-align:left;font:inherit;color:inherit;min-height:56px}
.noact.on{border:1.5px solid var(--g700);background:var(--g100)}
.actrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.actrow:first-child{border-top:none}
.actrow .t{flex:1}.actrow .t small{display:block;color:var(--muted);font-size:12px}
.x{width:44px;height:44px;border:none;background:none;color:var(--muted);font-size:20px;cursor:pointer}
/* water */
.glasses{display:flex;gap:4px;flex-wrap:wrap}
.glass{width:34px;height:44px;border:none;background:none;padding:0;cursor:pointer}
.glass .fill{transition:transform .3s cubic-bezier(.2,.8,.2,1);transform-origin:50% 100%}
/* scales */
.row{margin:14px 0}
.scale{display:flex;gap:6px}
.face{flex:1;min-height:58px;border:2px solid transparent;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 11px Figtree;transition:transform .18s,border-color .18s}
.face.on{border-color:var(--ink);transform:scale(1.06)}
.bath{background:#F3E7DC;border-color:#E2CDB9;color:#6B3E1E}
.bristol{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bristol button{min-height:76px;border:2px solid transparent;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 11px Figtree}
.bristol button.on{border-color:var(--ink)}
/* sleep */
.sleep{padding:12px 0;border-top:1px solid var(--line)}
.sleep:first-of-type{border-top:none}
.sleep .tline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sleep input[type=time]{border:1.5px solid var(--line);border-radius:10px;padding:8px 6px;font:600 15px Figtree;min-height:44px;background:var(--surface);color:var(--ink)}
.moons{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.moons button{width:40px;height:44px;border:none;background:none;cursor:pointer;padding:0;color:#D9D4C8;transition:transform .18s}
.moons button.on{color:#3D4C8C}
.moons button:active{transform:scale(.85)}
/* private */
.locked{display:flex;align-items:center;gap:12px;cursor:pointer}
.counter{display:flex;align-items:center;gap:10px;padding:8px 0}
.counter button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font:700 20px Figtree;cursor:pointer}
.counter b{min-width:20px;text-align:center;font:700 18px "Bricolage Grotesque"}
/* review, nav, sheet */
.review{position:sticky;bottom:88px;display:flex;justify-content:center;pointer-events:none;margin-top:8px}
.review .btn{pointer-events:auto;box-shadow:0 6px 16px rgba(184,78,24,.35)}
nav{position:absolute;left:0;right:0;bottom:0;height:76px;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding-bottom:8px}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px Figtree;color:var(--muted);text-decoration:none;min-width:56px}
nav a.on{color:var(--brand)}
nav .fab{width:56px;height:56px;border-radius:50%;background:var(--accent);display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 14px rgba(184,78,24,.35);border:none;cursor:pointer}
.scrim{position:absolute;inset:0;background:rgba(28,31,26,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px 24px;transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);max-height:86%;overflow-y:auto}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--grey);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-size:20px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{min-height:80px;border:2px solid transparent;border-radius:14px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:600 12px Figtree;color:var(--ink);transition:transform .18s}
.tile:active{transform:scale(.93)}
.tile.on{border-color:var(--g700);background:var(--g100)}
input.txt{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font:600 15px Figtree;background:var(--surface)}
.ex{display:flex;align-items:center;gap:8px;padding:6px 0}
.ex input{flex:1}
.ex .sr{width:80px;flex:none}
.search{position:relative;margin-bottom:12px}.search input{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px 10px 40px;font:600 15px Figtree;background:var(--surface)}
.search svg{position:absolute;left:12px;top:14px}
.sticky{position:sticky;bottom:-24px;background:var(--bg);padding:12px 0 4px;margin-top:12px}
.btn.big{min-height:56px;font-size:16px}
.frac{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.frac button{min-height:52px;border:2px solid transparent;border-radius:12px;background:var(--surface);font:700 16px "Bricolage Grotesque";cursor:pointer}
.frac button.on{border-color:var(--g700);background:var(--g100);color:var(--g700)}
.preview{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:12px;margin-bottom:12px}
.preview b{font:700 22px "Bricolage Grotesque"}
.toggle{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;border:none;width:100%;text-align:left;font:600 14px Figtree;min-height:52px;color:var(--ink)}
.sw{width:44px;height:26px;border-radius:999px;background:#D9D4C8;position:relative;flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--g700)}.sw.on:after{left:21px}
.drinks{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.drink{flex:none;min-height:44px;border:2px solid transparent;border-radius:999px;padding:4px 12px 4px 6px;display:inline-flex;align-items:center;gap:6px;font:600 13px Figtree;cursor:pointer}
.drink.on{border-color:var(--ink)}
.urine{display:flex;gap:6px}.urine button{flex:1;min-height:52px;border:2px solid transparent;border-radius:12px;font:700 12px Figtree;cursor:pointer}
.urine button.on{border-color:var(--ink)}
.sl-top{display:flex;align-items:baseline;gap:8px}.sl-top b{font:600 16px "Bricolage Grotesque"}.sl-top .h{margin-left:auto;font:700 14px Figtree;color:#3D4C8C}
.sl-times{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px}
.sl-times label{display:flex;flex-direction:column;font:600 11px Figtree;color:var(--muted)}
.sl-times input{width:100%}
.sl-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.info{border:none;background:none;color:var(--muted);font:600 12px Figtree;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:4px;padding:0}
.formula{background:var(--surface);border-radius:12px;padding:12px;font:600 14px/22px Figtree}
.note{font-size:11px;color:var(--muted);text-align:center;margin:18px 0 0}
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--brand);color:#fff;border-radius:999px;padding:8px 14px;font:600 13px Figtree;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:5}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="stage"><div class="phone">
<div class="scroll" id="scroll">
 <header>
  <button class="iconbtn" aria-label="Día anterior"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div style="text-align:center"><h1>Hoy</h1><small>martes 7 de octubre</small></div>
  <button class="iconbtn" aria-label="Elegir fecha"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg></button>
 </header>

 <section class="card" aria-label="Resumen del día">
  <div class="sum">
   <div class="rings">
    <svg viewBox="0 0 150 150" aria-hidden="true" id="ringSvg"></svg>
    <div class="center"><span class="num" id="done">0/6</span><span class="muted">registrado</span></div>
   </div>
   <div class="leg" id="legend"></div>
  </div>
  <div id="ranges"></div>
 </section>

 <section class="card" id="c-meals"><h2><span class="ib" style="background:#FBE9DF" id="ic-meals"></span>Comidas</h2><div id="meals"></div></section>

 <section class="card pending" id="c-activity"><h2><span class="ib" style="background:#E3EFE6" id="ic-act"></span>Actividad física<span class="right" id="actSum"></span></h2><div id="activity"></div></section>

 <section class="card pending" id="c-water"><h2><span class="ib" style="background:#E2EEF6" id="ic-water"></span>Hidratación<span class="right" id="waterTxt"></span></h2><div id="water"></div></section>

 <section class="card pending" id="c-body"><h2><span class="ib" style="background:#F6EBD6" id="ic-body"></span>Cuerpo y ánimo</h2><div id="body"></div></section>

 <section class="card pending" id="c-sleep"><h2><span class="ib" style="background:#E4E6F3" id="ic-sleep"></span>Sueño<span class="right" id="sleepTotal"></span></h2><div id="sleeps"></div></section>

 <section class="card"><h2><span class="ib" style="background:#EEE" id="ic-sym"></span>Tus síntomas</h2><div class="chips" id="syms"></div></section>

 <section class="card"><div class="locked" onclick="S.unlocked=!S.unlocked;render()"><span class="ib" style="background:#E3EFE6;width:40px;height:40px" id="ic-lock"></span><div style="flex:1"><b>Privado</b><div class="muted" id="lockTxt"></div></div></div><div id="private"></div></section>

 <div class="review"><button class="btn" id="reviewBtn" onclick="review()"></button></div>
 <p class="note">Prototipo · datos de ejemplo, no son valores nutricionales reales</p>
</div>

<nav aria-label="Navegación">
 <a href="#" class="on"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2" stroke-linecap="round"/></svg>Hoy</a>
 <a href="#"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 9.5h16M4 14.5h16M9.5 4v16M14.5 4v16"/></svg>Calendario</a>
 <button class="fab" aria-label="Registrar" onclick="openSheet('quick')"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
 <a href="#"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Análisis</a>
 <a href="#"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" stroke-linecap="round"/></svg>Perfil</a>
</nav>
<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
</div></div>

 pan:{bg:'#F6EBD6',s:'<path d="M8 22c0-7 7-10 16-10s16 3 16 10c0 2-2 3-3 3v11H11V25c-1 0-3-1-3-3z" fill="#D9A15A" stroke="#9A6B00" stroke-width="2"/>'},

   <div class="scale">${face(4,PAL5[4],'Mejor',S.bloat===0,'S.bloat=0;render()')}${face(2,PAL5[2],'Como siempre',S.bloat===1,'S.bloat=1;render()')}${face(0,PAL5[0],'Peor',S.bloat===2,'S.bloat=2;render()')}</div></div>
  <div class="row"><div class="lbl"><span class="ib" style="background:#FBE4E1">${ic('<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>','#B3392F')}</span>Máximo estrés que sentiste hoy</div>${scale('stress',['Nada','Poco','Medio','Alto','Máximo'],true)}<div class="muted" style="margin-top:4px">El pico del día, aunque luego te calmaras</div></div>
  <div class="row"><div class="lbl"><span class="ib" style="background:#E3EFE6">${ic('<rect x="3" y="7" width="16" height="10" rx="2"/><path d="M21 11v2M6 10v4M9 10v4"/>','#2E7346')}</span>Energía</div>${scale('energy',['Agotado','Baja','Normal','Buena','Mucha'],false)}</div>
  <div class="row" style="margin-bottom:0"><div class="lbl"><span class="ib" style="background:#E4E6F3">${ic('<circle cx="12" cy="12" r="9"/><path d="M8.5 14c1.8 2 5.2 2 7 0M9 9.5h.01M15 9.5h.01"/>','#3D4C8C')}</span>Ánimo</div>${scale('mood',['Mal','Bajo','Normal','Bien','Feliz'],false)}</div>`;
 // sleep
 document.getElementById('ic-sleep').innerHTML=ic('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>','#3D4C8C');
 const QL=['','Muy mala','Mala','Regular','Buena','Excelente'];
 document.getElementById('sleeps').innerHTML=S.sleeps.map((s,i)=>`<div class="sleep">
  <div class="sl-top"><b>${s.name}</b>${i>0?`<button class="x" style="height:32px" aria-label="Quitar" onclick="S.sleeps.splice(${i},1);render()">×</button>`:''}<span class="h">${hrs(s.from,s.to)} h</span></div>
  <div class="sl-times"><label>Me dormí<input type="time" value="${s.from}" onchange="S.sleeps[${i}].from=this.value;render()"></label><span style="padding-top:16px">→</span><label>Me desperté<input type="time" value="${s.to}" onchange="S.sleeps[${i}].to=this.value;render()"></label></div>
  <div class="muted" style="margin:10px 0 0">Calidad del sueño · <b style="color:${s.q?'#3D4C8C':'var(--accent)'}">${s.q?QL[s.q]:'toca una luna'}</b></div>
  <div class="sl-bottom"><div class="moons">${[1,2,3,4,5].map(q=>`<button class="${q<=s.q?'on':''}" aria-label="Calidad ${QL[q]}" onclick="S.sleeps[${i}].q=${q};render()">${ic('<path d="M19 14A7 7 0 1 1 10 5a5.5 5.5 0 0 0 9 9z"/>','currentColor',26).replace('fill="none"','fill="currentColor"')}</button>`).join('')}</div></div>
  <button class="toggle" style="margin-top:6px;background:var(--bg)" onclick="S.sleeps[${i}].nm=!S.sleeps[${i}].nm;render()"><span class="sw ${s.nm?'on':''}"></span>Tuve pesadillas</button></div>`).join('')+
  `<button class="link" onclick="S.sleeps.push({name:'Siesta',from:'14:00',to:'14:30',q:0,nm:false});render()">+ Agregar siesta</button><div class="muted">Las horas vienen de tu horario habitual; ajústalas si cambiaron.</div>`;
 const tot=S.sleeps.reduce((a,s)=>a+hrs(s.from,s.to),0);document.getElementById('sleepTotal').textContent=`${Math.round(tot*10)/10} h en total`;
 // symptoms + private
 document.getElementById('ic-sym').innerHTML=ic('<path d="M12 5v14M5 12h14"/>','#5E6358');
 document.getElementById('syms').innerHTML=Object.entries(S.syms).map(([k,v])=>`<button class="chip ${v?'on':''}" onclick="S.syms['${k}']=!S.syms['${k}'];render()">${k}</button>`).join('')+`<button class="chip add" onclick="toast('Crear síntoma propio')">+ Crear</button>`;
 document.getElementById('ic-lock').innerHTML=ic('<rect x="5" y="10" width="14" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>','#1F4D3A',22);
 document.getElementById('lockTxt').textContent=S.unlocked?'Toca para bloquear':'Toca para desbloquear con tu huella';
 document.getElementById('private').innerHTML=S.unlocked?`<div class="counter"><span style="flex:1">Relación sexual</span><button onclick="S.priv.a=Math.max(0,S.priv.a-1);render()">−</button><b>${S.priv.a}</b><button onclick="S.priv.a++;render()">+</button></div><div class="counter"><span style="flex:1">Masturbación</span><button onclick="S.priv.b=Math.max(0,S.priv.b-1);render()">−</button><b>${S.priv.b}</b><button onclick="S.priv.b++;render()">+</button></div><p class="muted">Nunca se envía a la IA. No cambia tus calorías.</p>`:'';
 // pending
 ['activity','water','body','sleep'].forEach(k=>document.getElementById('c-'+k).classList.toggle('pending',!done[k]));
 const n=['meals','activity','water','body','sleep'].filter(k=>!done[k]).length;
 const rb=document.getElementById('reviewBtn');rb.textContent=n?`Repasar mi día · faltan ${n}`:'Día completo ✓';rb.disabled=!n;
}
/* ===== actions ===== */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600);}
function go(k){if(k==='weight'){S.weight=true;render();toast('Peso registrado');return;}document.getElementById('c-'+k).scrollIntoView({block:'center'});}
function review(){const d=areaDone();const k=['meals','activity','water','body','sleep'].find(x=>!d[x]);if(k)go(k);}
function bandNow(){const h=new Date().getHours();return h<6?'Madrugada':h<12?'Mañana':h<15?'Mediodía':h<19?'Tarde':'Noche';}
let C={};
function openSheet(kind,arg){C={kind,arg,band:bandNow(),pick:null,dur:30,int:'Media',part:100,tab:'rec',icon:'plato',name:'',q:''};draw();document.getElementById('scrim').classList.add('open');document.getElementById('sheet').classList.add('open');}
function closeSheet(){document.getElementById('scrim').classList.remove('open');document.getElementById('sheet').classList.remove('open');}
const bandChips=()=>`<div class="row"><div class="lbl">¿Cuándo? <span class="muted">(aproximado)</span></div><div class="chips">${BANDS.map(b=>`<button class="chip ${C.band===b?'on':''}" onclick="C.band='${b}';draw()">${b}</button>`).join('')}<button class="chip" onclick="toast('Hora exacta opcional')">Hora exacta</button></div></div>`;
function draw(){const b=document.getElementById('sheetBody'),k=C.kind;
 if(k==='quick'){b.innerHTML=`<h3>¿Qué quieres registrar?</h3><div class="grid4">${[
  ['Comida',foodIcon('plato',40),"openSheet('meal','alm')"],['Baño',`<span class="fi" style="background:#F3E7DC;width:40px;height:40px">${poopIcon(30)}</span>`,"openSheet('bath')"],
  ['Actividad',actIcon('caminar'),"openSheet('act')"],['Agua',`<span class="fi" style="background:#E2EEF6;width:40px;height:40px">${ic('<path d="M6 3h12l-1.5 17h-9z"/>','#5B8DB8',26)}</span>`,"closeSheet();tapGlass(S.drinks.length)"],
  ['Ánimo',`<span class="fi" style="background:#E4E6F3;width:40px;height:40px">${ic('<circle cx="12" cy="12" r="9"/><path d="M8.5 14c1.8 2 5.2 2 7 0"/>','#3D4C8C',26)}</span>`,"closeSheet();go('body')"],
  ['Sueño',`<span class="fi" style="background:#E4E6F3;width:40px;height:40px">${ic('<path d="M19 14A7 7 0 1 1 10 5a5.5 5.5 0 0 0 9 9z"/>','#3D4C8C',26)}</span>`,"closeSheet();go('sleep')"],
  ['Peso',`<span class="fi" style="background:#F1EEE6;width:40px;height:40px">${ic('<path d="M5 20h14l-2-12H7zM9 8a3 3 0 0 1 6 0"/>','#6B5E55',26)}</span>`,"closeSheet();go('weight')"],
  ['Escribir',`<span class="fi" style="background:#FBE9DF;width:40px;height:40px">${ic('<path d="M4 20h4L19 9l-4-4L4 16z"/>','#B84E18',26)}</span>`,"toast('Atajo de texto (v0.2)')"]].map(([n,i,a])=>`<button class="tile" onclick="${a}">${i}${n}</button>`).join('')}</div>`;}
 if(k==='meal'){const sl=SLOTS.find(s=>s[0]===C.arg);const q=(C.q||'').toLowerCase();
  const list=[...FOODS].sort((a,b)=>b.last-a.last).filter(f=>!q||f.n.toLowerCase().includes(q)).slice(0,12);
  b.innerHTML=`<h3>${sl[1]}</h3><div class="search">${ic('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>','#5E6358',20)}<input id="q" placeholder="Buscar plato…" value="${C.q||''}" oninput="C.q=this.value;draw();const e=document.getElementById('q');e.focus();e.setSelectionRange(e.value.length,e.value.length)"></div>
  <div class="ftiles">${list.map(f=>`<button class="ftile" onclick="C.kind='portion';C.food='${f.n}';C.fr=1;C.grams='';C.left=false;draw()">${foodIcon(f.i)}${f.n}<small>${f.k} kcal · ración</small></button>`).join('')||'<p class="muted" style="grid-column:1/-1">No hay platos con ese nombre. Créalo abajo.</p>'}</div>
  <div class="sticky"><button class="btn big block" onclick="C.kind='create';C.name=C.q||'';draw()">+ Crear plato${C.q?` "${C.q}"`:''}</button></div>`;}
 if(k==='portion'){const f=FOODS.find(x=>x.n===C.food);const qv=C.grams?Number(C.grams)/f.g:C.fr;
  b.innerHTML=`<h3>¿Cuánto comiste?</h3><div class="preview">${foodIcon(f.i)}<div style="flex:1"><div style="font-weight:700">${f.n}</div><div class="muted">1 ración ≈ ${f.g} g · ${f.k} kcal</div></div><div style="text-align:right"><b>${Math.round(f.k*qv)}</b><div class="muted">kcal</div></div></div>
  <div class="lbl">Fracción de la ración</div><div class="frac">${FR.map(([v,l])=>`<button class="${!C.grams&&C.fr===v?'on':''}" onclick="C.fr=${v};C.grams='';draw()">${l}</button>`).join('')}</div>
  <div class="row"><div class="lbl">o en gramos</div><input class="txt" inputmode="numeric" placeholder="${f.g} g" value="${C.grams}" oninput="C.grams=this.value.replace(/[^0-9]/g,'');draw();const e=this;"></div>
  ${qv<1?`<button class="toggle" onclick="C.left=!C.left;draw()"><span class="sw ${C.left?'on':''}"></span><span style="flex:1">Guardar el resto (${fracLabel(Math.round((1-qv)*100)/100)||Math.round((1-qv)*100)+'%'}) para el desayuno de mañana</span></button>`:''}
  <div class="sticky"><button class="btn big block" onclick="addFood()">Agregar ${C.grams?C.grams+' g':fracLabel(C.fr)+' ración'}</button></div>`;}
 if(k==='formula'){const ex=[['Pesas · media · 35′',5.0,35],['Escaleras · media · 25′',6.8,25],['Caminar · media · 30′',3.5,30]];
  b.innerHTML=`<h3>¿Cómo se calculan las calorías extra?</h3>
  <div class="formula">kcal extra = (MET − 1) × (basal ÷ 24) × horas × 1,10</div>
  <ul class="muted" style="padding-left:18px;margin:10px 0;line-height:21px"><li><b>MET</b>: cuánto cansa la actividad comparada con estar sentado quieto (= 1). Sale del <b>Compendio de Actividades Físicas 2024</b>, según tipo e intensidad</li><li>Se resta 1 porque tu reposo <b>ya está</b> en la meta base</li><li><b>Basal ÷ 24</b>: lo que gastas en una hora en reposo, calculado con tu edad, peso y altura</li><li><b>× 1,10</b>: el 10 % extra que cuesta digerir lo que comes para reponer</li><li>Cada 1–2 semanas, tu peso real corrige el cálculo</li></ul>
  <div class="lbl">Ejemplos con basal ${BMR}</div>${ex.map(([n,met,m])=>`<div class="actrow"><div class="t"><b>${n}</b><small>MET ${met}</small></div><b>+${kcalOf(met,m)} kcal</b></div>`).join('')}`;}
 if(k==='create'){b.innerHTML=`<h3>Crear plato</h3><div class="lbl">Elige un ícono</div><div class="grid4" style="grid-template-columns:repeat(6,1fr)">${Object.keys(FI).map(x=>`<button class="tile ${C.icon===x?'on':''}" style="min-height:58px;padding:4px" aria-label="${x}" onclick="C.icon='${x}';draw()">${foodIcon(x,40)}</button>`).join('')}</div>
  <div class="row"><div class="lbl">Nombre</div><input class="txt" id="dname" placeholder="Ej.: Tacacho con cecina" value="${C.name}" oninput="C.name=this.value"></div>
  <p class="muted">Siguiente paso: ingredientes y gramos del catálogo (v0.1) o descríbelo y la IA los propone (v0.2).</p>
  <button class="btn block" onclick="createDish()">Guardar plato</button>`;}
 if(k==='act'){b.innerHTML=`<h3>Agregar actividad</h3><div class="grid4">${ACTTYPES.map(([key,n])=>`<button class="tile ${C.pick===key?'on':''}" onclick="C.pick='${key}';draw()">${actIcon(key)}${n}</button>`).join('')}</div>
  <div class="row"><div class="lbl">Duración</div><div class="chips">${[15,30,45,60,90].map(d=>`<button class="chip ${C.dur===d?'on':''}" onclick="C.dur=${d};draw()">${d}′</button>`).join('')}</div></div>
  <div class="row"><div class="lbl">Intensidad</div><div class="scale">${[['Suave',PAL5[3],'Puedes conversar'],['Media',PAL5[2],'Hablas entrecortado'],['Fuerte',PAL5[1],'Casi no puedes hablar']].map(([x,p,d])=>`<button class="face ${C.int===x?'on':''}" style="background:${p[0]};color:${p[1]}" onclick="C.int='${x}';draw()">${x}<span style="font-weight:400">${d}</span></button>`).join('')}</div></div>${C.pick?`<p class="muted" style="margin:0">+${kcalOf(metOf(C.pick,C.int),C.dur)} kcal · MET ${metOf(C.pick,C.int)} <button class="info" onclick="C.kind='formula';draw()">ⓘ cómo se calcula</button></p>`:''}${bandChips()}
  <button class="btn block" ${C.pick?'':'disabled'} onclick="addAct()">Agregar</button>`;}
 if(k==='routine'){const r=ROUTINES.find(x=>x.id===C.arg);b.innerHTML=`<h3>${r.n}</h3><p class="muted" style="margin-top:-6px">${r.m}′ · ${r.int} · ${r.ex.map(e=>e[0]).join(' · ')}</p>
  <div class="row"><div class="lbl">¿Cuánto hiciste?</div><div class="scale">${[[100,'Completa'],[75,'Casi toda'],[50,'La mitad'],[25,'Un poco']].map(([p,l],i)=>`<button class="face ${C.part===p?'on':''}" style="background:${PAL5[4-i][0]};color:${PAL5[4-i][1]}" onclick="C.part=${p};draw()">${p}%<br>${l}</button>`).join('')}</div></div>${bandChips()}
  <button class="btn block" onclick="addRoutine(${r.id})">Registrar ${r.n}</button><button class="link" onclick="C.kind='edit';draw()">Editar esta rutina</button>`;}
 if(k==='routines'){b.innerHTML=`<h3>Tus rutinas</h3>${ROUTINES.map(r=>`<div class="actrow">${actIcon(r.i)}<div class="t"><b>${r.n}</b><small>${r.m}′ · ${r.int} · ${r.ex.length} ejercicios</small></div><button class="link" onclick="C.kind='edit';C.arg=${r.id};draw()">Editar</button></div>`).join('')}
  <button class="btn ghost block" style="margin-top:10px" onclick="ROUTINES.push({id:Date.now(),n:'Nueva rutina',i:'pesas',m:30,int:'Media',ex:[['Ejercicio','3×10']]});C.kind='edit';C.arg=ROUTINES[ROUTINES.length-1].id;draw()">+ Crear rutina</button>`;}
 if(k==='edit'){const r=ROUTINES.find(x=>x.id===C.arg);b.innerHTML=`<h3>Editar rutina</h3>
  <div class="row"><div class="lbl">Nombre</div><input class="txt" value="${r.n}" oninput="ROUTINES.find(x=>x.id===${r.id}).n=this.value"></div>
  <div class="row"><div class="lbl">Tipo</div><div class="chips">${['pesas','escaleras','cardio','caminar'].map(t=>`<button class="chip ${r.i===t?'on':''}" onclick="ROUTINES.find(x=>x.id===${r.id}).i='${t}';draw()">${actIcon(t,26)}</button>`).join('')}</div></div>
  <div class="row"><div class="lbl">Duración habitual</div><div class="chips">${[20,25,30,35,45,60].map(d=>`<button class="chip ${r.m===d?'on':''}" onclick="ROUTINES.find(x=>x.id===${r.id}).m=${d};draw()">${d}′</button>`).join('')}</div></div>
  <div class="row"><div class="lbl">Ejercicios</div>${r.ex.map((e,i)=>`<div class="ex"><input class="txt" value="${e[0]}" oninput="ROUTINES.find(x=>x.id===${r.id}).ex[${i}][0]=this.value"><input class="txt sr" value="${e[1]}" oninput="ROUTINES.find(x=>x.id===${r.id}).ex[${i}][1]=this.value"><button class="x" onclick="ROUTINES.find(x=>x.id===${r.id}).ex.splice(${i},1);draw()">×</button></div>`).join('')}
  <button class="link" onclick="ROUTINES.find(x=>x.id===${r.id}).ex.push(['',''] );draw()">+ Ejercicio</button></div>
  <button class="btn block" onclick="closeSheet();render();toast('Rutina guardada')">Guardar</button>`;}
 if(k==='bath'){b.innerHTML=`<h3>${poopIcon(24)} Ida al baño</h3><div class="bristol">${[1,2,3,4,5,6,7].map(n=>`<button class="${C.pick===n?'on':''}" style="background:${BBG[n]};color:#6B3E1E" onclick="C.pick=${n};draw()">${bristolIcon(n)}${n} · ${BRISTOL[n]}</button>`).join('')}<button class="${C.pick==='gas'?'on':''}" style="background:#F1EEE6;color:#5E6358" onclick="C.pick='gas';draw()">${ic('<path d="M5 15c2-3 4 0 6-2s4-4 6-1 2 3 2 3"/>','#5E6358',28)}Solo gases</button></div>${bandChips()}
  <button class="btn block" ${C.pick?'':'disabled'} onclick="S.bath.push({t:C.pick,band:C.band});S.noBath=false;closeSheet();render()">Guardar</button>`;}
}
function addFood(){const f=FOODS.find(x=>x.n===C.food);const qv=C.grams?Number(C.grams)/f.g:C.fr;S.meals[C.arg].push({...f,q:Math.round(qv*100)/100});f.last=Math.max(...FOODS.map(x=>x.last))+1;closeSheet();render();toast(C.left&&qv<1?`${f.n} agregado · el resto queda para mañana`:`${f.n} agregado`);}
function tapGlass(i){if(i<S.drinks.length){S.drinks.splice(i,1);}else{S.drinks.push(S.drinkSel);}render();}
function createDish(){const n=(C.name||'Plato nuevo').trim();FOODS.push({n,i:C.icon,k:400,p:20,f:15,c:45,slot:C.arg,g:350,last:Math.max(...FOODS.map(x=>x.last))+1});C.q='';C.kind='meal';draw();toast('Plato creado');}
function addAct(){const [key,n]=ACTTYPES.find(a=>a[0]===C.pick);const m=metOf(key,C.int);S.acts.push({n,i:key,m:C.dur,int:C.int,band:C.band,kcal:kcalOf(m,C.dur)});S.noAct=false;closeSheet();render();toast(`+${kcalOf(m,C.dur)} kcal a tu meta`);}
function addRoutine(id){const r=ROUTINES.find(x=>x.id===id);const met=metOf(r.i,r.int);const m=Math.round(r.m*C.part/100);S.acts.push({n:r.n,i:r.i,m,int:r.int,band:C.band,part:C.part,kcal:kcalOf(met,m)});S.noAct=false;closeSheet();render();toast(`${r.n} registrada`);}
render();
</script>
