packages:
  - apps/*
  - packages/*
# Install scripts are denied unless listed here (pnpm 12 default).
allowBuilds:
  # drizzle-kit's bundler; the script only verifies its platform binary.
  esbuild: true
  # Ships prebuilt binaries; its postinstall is only a fallback download.
  unrs-resolver: false
  # Prisma downloads its schema engine; SWC verifies its platform binary (apps/api).
  '@prisma/engines': true
  prisma: true
  '@swc/core': true
  # Optional native speedups pulled by testcontainers' Docker client; pure-JS fallbacks work.
  cpu-features: false
  ssh2: false
  protobufjs: false
